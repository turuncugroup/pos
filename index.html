<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaPOS - Bulut Tabanlı Yeni Nesil Restoran Otomasyonu</title>
    <style>
        /* Kurumsal Premium Koyu Tema Altyapısı */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background-color: #0b0f19; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .hidden { display: none !important; }
        
        button { cursor: pointer; transition: all 0.2s ease-in-out; border: none; font-weight: 600; }
        button:active { transform: scale(0.96); }

        /* 👑 Premium Cam Efektli (Glassmorphism) Kart Tasarımı */
        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* 🔐 MODAL PENCERELERİ */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .modal-content { background: #151f32; padding: 35px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); max-width: 420px; width: 100%; text-align: center; }
        .modal-content h3 { margin-bottom: 15px; color: #38bdf8; font-size: 1.4rem; }
        .modal-content input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #334155; background: #0b0f19; color: #fff; text-align: center; font-size: 1.3rem; margin-bottom: 20px; outline: none; }
        .modal-btn { background: #10b981; color: white; padding: 14px; border-radius: 8px; font-size: 1rem; width: 100%; font-weight: bold; }

        /* 🔐 MODÜL 1: ŞİFRE EKRANI (PINPAD) */
        .pinpad-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 20px; }
        .pinpad-container { width: 100%; max-width: 360px; text-align: center; padding: 35px; }
        .pin-display { background: #090d16; padding: 15px; border-radius: 10px; font-size: 2.2rem; letter-spacing: 12px; height: 70px; display: flex; align-items: center; justify-content: center; color: #38bdf8; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 30px; font-weight: bold; }
        .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .pin-btn { background: rgba(255,255,255,0.05); color: #fff; padding: 22px; border-radius: 10px; font-size: 1.6rem; border: 1px solid rgba(255,255,255,0.02); }
        .pin-btn:hover { background: rgba(255,255,255,0.1); border-color: #38bdf8; }
        .pin-clear { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.4); }
        .pin-clear:hover { background: rgba(239, 68, 68, 0.4); }
        .pin-submit { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.4); }
        .pin-submit:hover { background: rgba(16, 185, 129, 0.4); }

        /* 🏁 MODÜL 2: DÖNEM BİLGİ EKRANI */
        .welcome-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 20px; }
        .welcome-container { width: 100%; max-width: 480px; text-align: center; padding: 40px; }
        .welcome-status { background: #0f172a; padding: 12px; border-radius: 8px; font-size: 0.95rem; color: #94a3b8; margin-bottom: 35px; border: 1px dashed rgba(255,255,255,0.1); }
        .welcome-btn { padding: 18px; border-radius: 10px; font-size: 1.1rem; color: white; width: 100%; margin-bottom: 15px; font-weight: bold; }

        /* 🌌 MODÜL 3: SAMBAPOS TARZI DEV 6'LI KUTULU ANA MENÜ */
        .main-menu-wrapper { display: none; flex-direction: column; width: 100vw; height: 100vh; padding: 40px; box-sizing: border-box; justify-content: center; align-items: center; }
        .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; width: 100%; max-width: 960px; margin: auto; }
        .menu-box {
            padding: 35px 20px;
            height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            font-weight: bold;
            color: #fff;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .menu-box:hover {
            background: rgba(56, 189, 248, 0.08);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
            transform: translateY(-4px);
        }
        .menu-box img, .menu-box svg { width: 40px; height: 40px; }

        /* 🖥️ ALT SUB-PANELLER: POS, GEÇMİŞ, RAPORLAR, AYARLAR, PATRON */
        .sub-panel-layout { display: none; width: 100vw; height: 100vh; flex-direction: column; background: #0b0f19; position: fixed; top: 0; left: 0; z-index: 1000; }
        .panel-header { height: 60px; background: #151f32; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; padding: 0 25px; }
        .panel-body { flex: 1; display: flex; overflow: hidden; position: relative; width: 100%; }

        /* MASA SEKMELERİ */
        .zone-bar { height: 55px; background: #0b0f19; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; gap: 8px; padding: 5px 20px; align-items: center; }
        .zone-btn { background: #151f32; color: #94a3b8; padding: 10px 20px; border-radius: 8px; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.05); }
        .zone-btn.active { background: #38bdf8; color: #0b0f19; border-color: #38bdf8; font-weight: bold; }
        .grid-map { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; padding: 20px; overflow-y: auto; }
        .table-box { background: #151f32; border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 110px; color: #fff; font-size: 1.15rem; cursor: pointer; }
        .table-box.occupied { background: rgba(244, 63, 94, 0.2); border-color: #f43f5e; box-shadow: 0 0 15px rgba(244, 63, 94, 0.1); }
        .table-box.bill-requested { background: rgba(168, 85, 247, 0.2); border-color: #a855f7; box-shadow: 0 0 15px rgba(168, 85, 247, 0.1); }

        /* ADİSYON SİPARİŞ EKRANI */
        .order-dock { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0b0f19; display: flex; z-index: 1100; }
        .ticket-col { width: 340px; background: #151f32; border-right: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; }
        .ticket-items { flex: 1; padding: 15px; overflow-y: auto; }
        .ticket-item-row { display: flex; justify-content: space-between; font-size: 0.95rem; padding: 10px 5px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .menu-col { flex: 1; display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.08); }
        .menu-cats { height: 65px; background: #151f32; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; gap: 8px; padding: 5px; overflow-x: auto; align-items: center; }
        .cat-btn { background: #0b0f19; color: #94a3b8; padding: 10px 18px; border-radius: 8px; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.05); white-space: nowrap; }
        .cat-btn.active { background: #38bdf8; color: #0b0f19; font-weight: bold; border-color: #38bdf8; }
        .menu-products { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; padding: 20px; overflow-y: auto; }
        .prod-grid-btn { background: #151f32; border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; color: white; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; height: 100px; cursor: pointer; }
        .action-col { width: 140px; background: #151f32; display: flex; flex-direction: column; gap: 10px; padding: 15px; }
        .act-btn { width: 100%; padding: 18px 5px; border-radius: 8px; color: white; font-size: 0.9rem; text-align: center; }

        /* ÖDEME MATRİX DOCK */
        .payment-dock { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0b0f19; display: flex; z-index: 1200; }
        .numpad-display { width: 100%; max-width: 320px; background: #151f32; border: 1px solid rgba(255,255,255,0.08); padding: 18px; text-align: right; font-size: 2.2rem; font-weight: 800; border-radius: 10px; margin-bottom: 25px; color: #38bdf8; height: 80px; }
        .numpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 320px; }
        .num-btn { background: #151f32; border: 1px solid rgba(255,255,255,0.05); color: white; padding: 20px; border-radius: 10px; font-size: 1.5rem; cursor: pointer; }

        /* 🖨️ 80mm ESC/POS TERMAL FIŞ ÖNİZLEME */
        .receipt-preview-side { width: 340px; background: #fff; color: #000; border-radius: 4px; padding: 15px; box-shadow: 0 10px 15px rgba(0,0,0,0.5); overflow-y: auto; }

        /* 💾 👤 SABİT ALT NAVİGASYON ŞERİDİ */
        .fixed-footer-bar {
            width: 100vw;
            height: 60px;
            background: #151f32;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            position: fixed;
            bottom: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 800;
        }
