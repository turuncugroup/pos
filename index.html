<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaPOS - Bulut Tabanlı Yeni Nesil Restoran Otomasyonu</title>
</head>
<body style="background-color: #0b0f19; color: #f8fafc; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; min-height: 100vh; display: flex; flex-direction: column; overflow: hidden;">

    <!-- ========================================================= -->
    <!-- 🔐 MODAL: GÜN BAŞI KASA GİRİŞİ -->
    <!-- ========================================================= -->
    <div id="gbModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 8, 16, 0.9); display: none; align-items: center; justify-content: center; z-index: 99999;">
        <div style="background: #111827; padding: 35px; border-radius: 16px; border: 1px solid #1e293b; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 0 30px rgba(56, 189, 248, 0.15);">
            <h3 style="color: #38bdf8; margin-bottom: 10px; font-size: 1.4rem; font-weight: 800; letter-spacing: 0.5px;">☀️ Gün Başı Dönem Açılışı</h3>
            <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px;">Lütfen kasadaki güncel nakit açılış tutarını giriniz:</p>
            <input type="number" id="openingCashInput" value="500" style="width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #334155; background: #0b0f19; color: #fff; text-align: center; font-size: 1.3rem; margin-bottom: 25px; outline: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);">
            <button onclick="submitGunBasi()" style="background: linear-gradient(135deg, #10b981, #059669); color: white; padding: 14px; border-radius: 8px; font-size: 1rem; width: 100%; font-weight: bold; cursor: pointer; border:none; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);">Dönemi Resmen Başlat</button>
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- 🔐 EKRAN 1: ŞİFRE GİRİŞ EKRANI (PINPAD) -->
    <!-- ========================================================= -->
    <div id="pinpadScreen" style="display: none; width: 100%; max-width: 380px; text-align: center; background: #111827; padding: 40px 35px; border-radius: 20px; border: 1px solid #1e293b; box-shadow: 0 25px 60px -15px rgba(0,0,0,0.7), 0 0 40px rgba(56, 189, 248, 0.03); margin: 60px auto;">
        <h1 style="font-size: 2.5rem; font-weight: 900; margin-bottom: 5px; color:#fff; letter-spacing: 0.5px;">Nexa<span style="color: #38bdf8; text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);">POS</span></h1>
        <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 30px; font-weight: 500;">Kurumsal Restoran Yönetim Sistemi</p>
        <input type="password" id="pinDisplayInput" maxlength="4" readonly style="background: #0b0f19; width: 100%; border-radius: 10px; font-size: 2.4rem; letter-spacing: 14px; height: 75px; text-align: center; color: #38bdf8; border: 1px solid #1e293b; margin-bottom: 30px; font-weight: bold; outline: none; box-shadow: inset 0 4px 8px rgba(0,0,0,0.6);">
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;">
            <button onclick="appendPin('1')" style="background: #1f2937; color: #f3f4f6; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border: 1px solid #374151; cursor:pointer;">1</button>
            <button onclick="appendPin('2')" style="background: #1f2937; color: #f3f4f6; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border: 1px solid #374151; cursor:pointer;">2</button>
            <button onclick="appendPin('3')" style="background: #1f2937; color: #f3f4f6; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border: 1px solid #374151; cursor:pointer;">3</button>
            <button onclick="appendPin('4')" style="background: #1f2937; color: #f3f4f6; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border: 1px solid #374151; cursor:pointer;">4</button>
            <button onclick="appendPin('5')" style="background: #1f2937; color: #f3f4f6; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border: 1px solid #374151; cursor:pointer;">5</button>
            <button onclick="appendPin('6')" style="background: #1f2937; color: #f3f4f6; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border: 1px solid #374151; cursor:pointer;">6</button>
            <button onclick="appendPin('7')" style="background: #1f2937; color: #f3f4f6; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border: 1px solid #374151; cursor:pointer;">7</button>
            <button onclick="appendPin('8')" style="background: #1f2937; color: #f3f4f6; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border: 1px solid #374151; cursor:pointer;">8</button>
            <button onclick="appendPin('9')" style="background: #1f2937; color: #f3f4f6; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border: 1px solid #374151; cursor:pointer;">9</button>
            <button onclick="document.getElementById('pinDisplayInput').value = '';" style="background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border: none; cursor:pointer;">C</button>
            <button onclick="appendPin('0')" style="background: #1f2937; color: #f3f4f6; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border: 1px solid #374151; cursor:pointer;">0</button>
            <button onclick="submitPinVerify()" style="background: linear-gradient(135deg, #10b981, #047857); color: #fff; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border: none; cursor:pointer; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);">✔</button>
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- 👑 EKRAN 2: WEB/SAMBAPOS TARZI PREMİUM ANA MENÜ (DASHBOARD) -->
    <!-- ========================================================= -->
    <div id="sambaMainMenu" style="display: none; width: 100vw; flex: 1; flex-direction: column; justify-content: center; align-items: center; padding: 40px; box-sizing: border-box;">
        <h2 style="font-size: 2.2rem; color:#fff; font-weight:900; margin-bottom:5px; letter-spacing:0.5px;">Nexa<span style="color:#38bdf8;">POS</span> Control Suite</h2>
        <p style="font-size:0.9rem; color:#64748b; margin-bottom:40px; font-weight:500;">Lütfen yapacağınız işlemi listeden seçiniz</p>
        
        <!-- Premium Kurumsal Koyu Lacivert & Neon Mavi Çerçeveli Grid Yapı -->
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; width: 100%; max-width: 950px;">
            <button onclick="checkShiftAndOpen()" style="background: #111827; color:#fff; padding: 40px 20px; border-radius: 16px; font-size: 1.3rem; font-weight: 700; border: 2px solid #1e293b; height:150px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; transition:0.2s;" onmouseenter="this.style.borderColor='#38bdf8'; this.style.boxShadow='0 0 20px rgba(56, 189, 248, 0.15)';" onmouseleave="this.style.borderColor='#1e293b'; this.style.boxShadow='none';">
                <span style="font-size:2rem;">🖥️</span> <span>POS (Masalar)</span>
            </button>
            <button onclick="openSubPanel('donem')" style="background: #111827; color:white; padding: 40px 20px; border-radius: 16px; font-size: 1.3rem; font-weight: 700; border: 2px solid #1e293b; height:150px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; transition:0.2s;" onmouseenter="this.style.borderColor='#38bdf8'; this.style.boxShadow='0 0 20px rgba(56, 189, 248, 0.15)';" onmouseleave="this.style.borderColor='#1e293b'; this.style.boxShadow='none';">
                <span style="font-size:2rem;">☀️</span> <span>Gün İşlemleri (Aç/Kapat)</span>
            </button>
            <button onclick="openSubPanel('gecmis')" style="background: #111827; color:white; padding: 40px 20px; border-radius: 16px; font-size: 1.3rem; font-weight: 700; border: 2px solid #1e293b; height:150px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; transition:0.2s;" onmouseenter="this.style.borderColor='#38bdf8'; this.style.boxShadow='0 0 20px rgba(56, 189, 248, 0.15)';" onmouseleave="this.style.borderColor='#1e293b'; this.style.boxShadow='none';">
                <span style="font-size:2rem;">📑</span> <span>Geçmiş Adisyonlar</span>
            </button>
            <button onclick="openSubPanel('raporlar')" style="background: #111827; color:white; padding: 40px 20px; border-radius: 16px; font-size: 1.3rem; font-weight: 700; border: 2px solid #1e293b; height:150px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; transition:0.2s;" onmouseenter="this.style.borderColor='#38bdf8'; this.style.boxShadow='0 0 20px rgba(56, 189, 248, 0.15)';" onmouseleave="this.style.borderColor='#1e293b'; this.style.boxShadow='none';">
                <span style="font-size:2rem;">📊</span> <span>Raporlar & Analiz</span>
            </button>
            <button onclick="openSubPanel('ayarlar')" style="background: #111827; color:white; padding: 40px 20px; border-radius: 16px; font-size: 1.3rem; font-weight: 700; border: 2px solid #1e293b; height:150px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; transition:0.2s;" onmouseenter="this.style.borderColor='#38bdf8'; this.style.boxShadow='0 0 20px rgba(56, 189, 248, 0.15)';" onmouseleave="this.style.borderColor='#1e293b'; this.style.boxShadow='none';">
