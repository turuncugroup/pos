<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaPOS - Bulut Tabanlı Yeni Nesil Restoran Otomasyonu</title>
</head>
<body style="background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; font-family: sans-serif;">

    <!-- TÜM SİSTEMİ İÇİNE ALAN ANA TAŞIYICI -->
    <div id="appContainer" style="width: 100%; max-width: 400px; margin: 50px auto; background-color: #1e293b; padding: 30px; border-radius: 16px; border: 1px solid #334155; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);">
        
        <h1 style="font-size: 2.5rem; margin-bottom: 5px; font-weight: 800;">Nexa<span style="color: #38bdf8;">POS</span></h1>
        <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 20px;">Lütfen 4 Haneli Personel Şifrenizi Giriniz</p>
        
        <!-- ŞİFRE GÖSTERGE ALANI -->
        <div id="pinDisplay" style="background-color: #0f172a; padding: 15px; border-radius: 8px; font-size: 2rem; letter-spacing: 10px; height: 60px; display: flex; align-items: center; justify-content: center; color: #38bdf8; border: 1px solid #334155; margin-bottom: 25px; font-weight: bold;"></div>
        
        <!-- DOKUNMATİK TUŞ TAKIMI GRİDİ -->
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
            <button onclick="pressPin('1')" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold;">1</button>
            <button onclick="pressPin('2')" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold;">2</button>
            <button onclick="pressPin('3')" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold;">3</button>
            <button onclick="pressPin('4')" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold;">4</button>
            <button onclick="pressPin('5')" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold;">5</button>
            <button onclick="pressPin('6')" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold;">6</button>
            <button onclick="pressPin('7')" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold;">7</button>
            <button onclick="pressPin('8')" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold;">8</button>
            <button onclick="pressPin('9')" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold;">9</button>
            <button onclick="clearPin()" style="background: #ef4444; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold;">C</button>
            <button onclick="pressPin('0')" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold;">0</button>
            <button onclick="submitPin()" style="background: #10b981; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold;">✔</button>
        </div>
    </div>

    <script>
        var pinInput = "";

        // Tarayıcıya zorunlu ilk çizim komutunu gönderiyoruz
        window.onload = function() {
            document.getElementById("pinDisplay").innerText = "";
            console.log("NexaPOS Core UI Initialized.");
        };

        function pressPin(num) {
            if(pinInput.length < 4) {
                pinInput += num;
                document.getElementById("pinDisplay").innerText = "*".repeat(pinInput.length);
            }
        }

        function clearPin() {
            pinInput = "";
            document.getElementById("pinDisplay").innerText = "";
        }

        function submitPin() {
            // Master Şifremiz: 1234
            if(pinInput === "1234") {
                alert("Giriş Başarılı! Sistem Dönem Açılış Ekranına Aktarılıyor...");
                // Diğer tüm SambaPOS kasa ekranı modülleri bu adımdan sonra devreye girecek
                pinInput = ""; 
                clearPin();
            } else {
                alert("Hatalı Personel Şifresi! Lütfen tekrar deneyin.");
                clearPin();
            }
        }
    </script>
</body>
</html>
