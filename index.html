<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaPOS - Bulut Tabanlı Yeni Nesil Restoran Otomasyonu</title>
</head>
<body style="background-color: #0f172a; color: #f8fafc; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; min-height: 100vh;">

    <!-- ========================================================= -->
    <!-- 🔐 MODAL: GÜN BAŞI KASA GİRİŞİ -->
    <!-- ========================================================= -->
    <div id="gbModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 9999;">
        <div style="background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; max-width: 400px; width: 100%; text-align: center;">
            <h3 style="color: #38bdf8; margin-bottom: 10px;">☀️ Gün Başı Dönem Açılışı</h3>
            <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px;">Lütfen kasadaki güncel nakit açılış tutarını giriniz:</p>
            <input type="number" id="openingCashInput" value="500" style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; text-align: center; font-size: 1.2rem; margin-bottom: 20px; outline: none;">
            <button onclick="window.isShiftOpen=true; document.getElementById('gbModal').style.display='none'; document.getElementById('shiftStatusTxt').innerText='Dönem: SİSTEM AÇIK (Kasa: ' + document.getElementById('openingCashInput').value + ' TL)'; document.getElementById('panelGbBtn').style.display='none'; document.getElementById('panelGsBtn').style.display='block';" style="background: #10b981; color: white; padding: 12px 25px; border-radius: 6px; font-size: 1rem; width: 100%; font-weight: 600; cursor: pointer; border:none;">Dönemi Resmen Başlat</button>
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- 🔐 EKRAN 1: ŞİFRE GİRİŞ EKRANI (PINPAD) -->
    <!-- ========================================================= -->
    <div id="pinpadScreen" style="display: block; width: 100%; max-width: 360px; text-align: center; background: #1e293b; padding: 35px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); margin: 80px auto;">
        <h1 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 5px;">Nexa<span>POS</span></h1>
        <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 25px;">Lütfen 4 Haneli Personel Şifrenizi Giriniz</p>
        <input type="password" id="pinDisplayInput" maxlength="4" readonly style="background: #0f172a; width: 100%; border-radius: 8px; font-size: 2.2rem; letter-spacing: 12px; height: 70px; text-align: center; color: #38bdf8; border: 1px solid #334155; margin-bottom: 25px; font-weight: bold; outline: none;">
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
            <button onclick="if(document.getElementById('pinDisplayInput').value.length < 4) document.getElementById('pinDisplayInput').value += '1';" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold; border:none; cursor:pointer;">1</button>
            <button onclick="if(document.getElementById('pinDisplayInput').value.length < 4) document.getElementById('pinDisplayInput').value += '2';" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold; border:none; cursor:pointer;">2</button>
            <button onclick="if(document.getElementById('pinDisplayInput').value.length < 4) document.getElementById('pinDisplayInput').value += '3';" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold; border:none; cursor:pointer;">3</button>
            <button onclick="if(document.getElementById('pinDisplayInput').value.length < 4) document.getElementById('pinDisplayInput').value += '4';" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold; border:none; cursor:pointer;">4</button>
            <button onclick="if(document.getElementById('pinDisplayInput').value.length < 4) document.getElementById('pinDisplayInput').value += '5';" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold; border:none; cursor:pointer;">5</button>
            <button onclick="if(document.getElementById('pinDisplayInput').value.length < 4) document.getElementById('pinDisplayInput').value += '6';" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold; border:none; cursor:pointer;">6</button>
            <button onclick="if(document.getElementById('pinDisplayInput').value.length < 4) document.getElementById('pinDisplayInput').value += '7';" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold; border:none; cursor:pointer;">7</button>
            <button onclick="if(document.getElementById('pinDisplayInput').value.length < 4) document.getElementById('pinDisplayInput').value += '8';" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold; border:none; cursor:pointer;">8</button>
            <button onclick="if(document.getElementById('pinDisplayInput').value.length < 4) document.getElementById('pinDisplayInput').value += '9';" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold; border:none; cursor:pointer;">9</button>
            <button onclick="document.getElementById('pinDisplayInput').value = '';" style="background: #ef4444; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold; border:none; cursor:pointer;">C</button>
            <button onclick="if(document.getElementById('pinDisplayInput').value.length < 4) document.getElementById('pinDisplayInput').value += '0';" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold; border:none; cursor:pointer;">0</button>
            <!-- ⚡ DEĞİŞİKLİK: Şifre girince beklemeden doğrudan Kutu Kutu Ana Menüye atar -->
            <button onclick="if(document.getElementById('pinDisplayInput').value === '1234') { document.getElementById('pinpadScreen').style.display='none'; document.getElementById('sambaMainMenu').style.display='flex'; document.getElementById('pinDisplayInput').value=''; } else { alert('Hatalı Personel Şifresi!'); document.getElementById('pinDisplayInput').value=''; }" style="background: #10b981; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold; border:none; cursor:pointer;">✔</button>
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- 👑 EKRAN 2: SAMBAPOS TARZI DEV KUTULU ANA MENÜ (DASHBOARD) -->
    <!-- ========================================================= -->
    <div id="sambaMainMenu" style="display: none; width: 100vw; height: 100vh; background: #0f172a; position: fixed; top: 0; left: 0; flex-direction: column; padding: 40px; box-sizing: border-box; justify-content: center; align-items: center; z-index: 500;">
        <h2 style="font-size: 2.2rem; color:#38bdf8; font-weight:800; margin-bottom:30px; letter-spacing:1px;">NexaPOS ANA MENÜ</h2>
        
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; width: 100%; max-width: 900px;">
            <button onclick="checkShiftAndOpen()" style="background: linear-gradient(135deg, #38bdf8, #0284c7); color:#0f172a; padding: 40px 20px; border-radius: 16px; font-size: 1.4rem; font-weight: 800; box-shadow: 0 10px 20px rgba(0,0,0,0.3); border:none; height:160px; cursor:pointer;">🖥️ POS (Masalar)</button>
            <!-- ☀️/🌙 YENİ KUTU: GÜN BAŞI / GÜN SONU İŞLEMLERİ MODÜLÜ -->
            <button onclick="openSubPanel('donem')" style="background: linear-gradient(135deg, #ec4899, #be185d); color:white; padding: 40px 20px; border-radius: 16px; font-size: 1.4rem; font-weight: 800; box-shadow: 0 10px 20px rgba(0,0,0,0.3); border:none; height:160px; cursor:pointer;">☀️/🌙 Gün İşlemleri</button>
            <button onclick="openSubPanel('gecmis')" style="background: linear-gradient(135deg, #a855f7, #7e22ce); color:white; padding: 40px 20px; border-radius: 16px; font-size: 1.4rem; font-weight: 800; box-shadow: 0 10px 20px rgba(0,0,0,0.3); border:none; height:160px; cursor:pointer;">📑 Geçmiş Adisyonlar</button>
            <button onclick="openSubPanel('raporlar')" style="background: linear-gradient(135deg, #10b981, #047857); color:white; padding: 40px 20px; border-radius: 16px; font-size: 1.4rem; font-weight: 800; box-shadow: 0 10px 20px rgba(0,0,0,0.3); border:none; height:160px; cursor:pointer;">📊 Raporlar</button>
            <button onclick="openSubPanel('ayarlar')" style="background: linear-gradient(135deg, #475569, #334155); color:white; padding: 40px 20px; border-radius: 16px; font-size: 1.4rem; font-weight: 800; box-shadow: 0 10px 20px rgba(0,0,0,0.3); border:none; height:160px; cursor:pointer;">⚙️ Ayarlar</button>
            <button onclick="openSubPanel('patron')" style="background: linear-gradient(135deg, #eab308, #ca8a04); color:#0f172a; padding: 40px 20px; border-radius: 16px; font-size: 1.4rem; font-weight: 800; box-shadow: 0 10px 20px rgba(0,0,0,0.3); border:none; height:160px; cursor:pointer;">👔 Patron Paneli</button>
        </div>
