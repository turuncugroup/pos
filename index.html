<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaPOS - Bulut Tabanlı Yeni Nesil Restoran Otomasyonu</title>
</head>
<body style="background-color: #0f172a; color: #f8fafc; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; min-height: 100vh; display: flex; align-items: center; justify-content: center;">

    <!-- ☀️ MODAL: GÜN BAŞI DÖNEM AÇILIŞI -->
    <div id="gbModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 999; display: none;">
        <div style="background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);">
            <h3 style="margin-bottom: 15px; color: #38bdf8;">☀️ Gün Başı Dönem Açılışı</h3>
            <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px;">Lütfen kasadaki güncel nakit açılış tutarını giriniz:</p>
            <input type="number" id="openingCashInput" value="500" style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; text-align: center; font-size: 1.2rem; margin-bottom: 20px; outline: none;">
            <button onclick="submitGunBasi()" style="background: #10b981; color: white; padding: 12px 25px; border-radius: 6px; font-size: 1rem; width: 100%; font-weight: 600; cursor: pointer; border: none;">Dönemi Resmen Başlat</button>
        </div>
    </div>

    <!-- 🔐 MODÜL 1: PINPAD ŞİFRE GİRİŞ EKRANI -->
    <div id="pinpadScreen" style="width: 100%; max-width: 360px; text-align: center; background: #1e293b; padding: 35px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); margin: 20px auto; display: block;">
        <h1 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 5px;">Nexa<span style="color: #38bdf8;">POS</span></h1>
        <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 25px;">Lütfen 4 Haneli Personel Şifrenizi Giriniz</p>
        <div id="pinDisplay" style="background: #0f172a; padding: 15px; border-radius: 8px; font-size: 2rem; letter-spacing: 10px; height: 70px; display: flex; align-items: center; justify-content: center; color: #38bdf8; border: 1px solid #334155; margin-bottom: 25px; font-weight: bold;"></div>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
            <button onclick="pressPin('1')" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: 600; border: none; cursor: pointer;">1</button>
            <button onclick="pressPin('2')" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: 600; border: none; cursor: pointer;">2</button>
            <button onclick="pressPin('3')" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: 600; border: none; cursor: pointer;">3</button>
            <button onclick="pressPin('4')" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: 600; border: none; cursor: pointer;">4</button>
            <button onclick="pressPin('5')" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: 600; border: none; cursor: pointer;">5</button>
            <button onclick="pressPin('6')" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: 600; border: none; cursor: pointer;">6</button>
            <button onclick="pressPin('7')" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: 600; border: none; cursor: pointer;">7</button>
            <button onclick="pressPin('8')" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: 600; border: none; cursor: pointer;">8</button>
            <button onclick="pressPin('9')" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: 600; border: none; cursor: pointer;">9</button>
            <button onclick="clearPin()" style="background: #ef4444; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: 600; border: none; cursor: pointer;">C</button>
            <button onclick="pressPin('0')" style="background: #334155; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: 600; border: none; cursor: pointer;">0</button>
            <button onclick="submitPin()" style="background: #10b981; color: #fff; padding: 20px; border-radius: 8px; font-size: 1.5rem; font-weight: 600; border: none; cursor: pointer;">✔</button>
        </div>
    </div>

    <!-- 🏁 MODÜL 2: KARŞILAMA EKRANI (DÖNEM YÖNETİMİ) -->
    <div id="welcomeScreen" style="width: 100%; max-width: 500px; text-align: center; background: #1e293b; padding: 40px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); margin: 20px auto; display: none;">
        <h2 style="font-size: 1.8rem; margin-bottom: 10px;">Hoş Geldiniz, <span style="color:#38bdf8;">Kasiyer</span></h2>
        <div id="shiftStatusTxt" style="background: #334155; padding: 10px; border-radius: 6px; font-size: 0.9rem; color: #94a3b8; margin-bottom: 30px;">Mevcut Dönem: Kapalı (Satış Yapılamaz)</div>
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <button id="gbBtn" onclick="openGunBasiModal()" style="padding: 18px; border-radius: 8px; font-size: 1.1rem; color: white; background: linear-gradient(135deg, #10b981, #059669); font-weight: 600; border: none; cursor: pointer;">☀️ Gün Başı Yap (Dönem Aç)</button>
            <button id="posEntryBtn" onclick="enterPosTerminal()" style="padding: 18px; border-radius: 8px; font-size: 1.1rem; color: white; background: linear-gradient(135deg, #38bdf8, #0284c7); margin-top: 10px; font-weight: 600; border: none; cursor: pointer; display: none;">💻 POS Terminaline Giriş</button>
            <button id="gsBtn" onclick="triggerGunSonu()" style="padding: 18px; border-radius: 8px; font-size: 1.1rem; color: white; background: linear-gradient(135deg, #ef4444, #dc2626); margin-top: 10px; font-weight: 600; border: none; cursor: pointer; display: none;">🌙 Gün Sonu Yap (Z Raporu / Kapat)</button>
        </div>
    </div>

    <!-- 💻 MODÜL 3: ANA CORE POS TERMİNALİ -->
    <div id="posTerminal" style="width: 100vw; height: 100vh; display: flex; flex-direction: column; background: #0f172a; position: fixed; top: 0; left: 0; z-index: 100; display: none;">
        <!-- ÜST NAVİGASYON ŞERİDİ -->
        <div style="height: 50px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; padding: 0 20px;">
            <div style="display:flex; align-items:center; gap:15px;">
                <strong style="color:#38bdf8; font-size:1.2rem;">NexaPOS</strong>
                <span id="licenseBadge" style="background: #eab308; color: #0f172a; padding: 4px 12px; border-radius: 4px; font-size: 0.8rem; font-weight: 700;">DENEME SÜRÜMÜ: 15 GÜN KALDI!</span>
            </div>
            <div style="display: flex; gap: 5px; height: 100%;">
                <button id="tabBtn-masalar" onclick="switchMainTab('masalar')" style="background: transparent; color: #38bdf8; padding: 0 15px; height: 100%; font-size: 0.9rem; border: none; border-bottom: 3px solid #38bdf8; cursor: pointer;">Masalar</button>
                <button id="tabBtn-gecmis" onclick="switchMainTab('gecmis')" style="background: transparent; color: #94a3b8; padding: 0 15px; height: 100%; font-size: 0.9rem; border: none; cursor: pointer;">Geçmiş Adisyonlar</button>
                <button id="tabBtn-raporlar" onclick="switchMainTab('raporlar')" style="background: transparent; color: #94a3b8; padding: 0 15px; height: 100%; font-size: 0.9rem; border: none; cursor: pointer;">Raporlar</button>
                <button id="tabBtn-ayarlar" onclick="switchMainTab('ayarlar')" style="background: transparent; color: #94a3b8; padding: 0 15px; height: 100%; font-size: 0.9rem; border: none; cursor: pointer;">Ayarlar</button>
                <button id="tabBtn-patron" onclick="switchMainTab('patron')" style="background: transparent; color: #eab308; padding: 0 15px; height: 100%; font-size: 0.9rem; border: none; cursor: pointer;">👔 Patron Paneli</button>
                <button onclick="lockSystem()" style="background: transparent; color: #ef4444; padding: 0 15px; height: 100%; font-size: 0.9rem; border: none; font-weight: bold; cursor: pointer; margin-left: 15px;">🔒 Kilitle</button>
            </div>
        </div>

        <!-- POS İÇ GÖVDE PANELİ -->
        <div style="flex: 1; display: flex; overflow: hidden; position: relative; width: 100%;">
            
            <!-- SEKMELİ PANEL 1: MASALAR VE KAT DÜZENİ -->
            <div id="panel-masalar" style="width: 100%; height: 100%; display: flex;">
                <div style="flex: 1; display: flex; flex-direction: column; height: 100%;">
                    <div id="zoneContainer" style="height: 50px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; gap: 5px; padding: 5px 15px; align-items: center;"></div>
                    <div id="tablesGrid" style="flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px; padding: 20px; overflow-y: auto;"></div>
                </div>

                <!-- SAMBAPOS TARZI ADİSYON / SİPARİŞ GİRİŞ EKRANI -->
