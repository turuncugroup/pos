<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaPOS - Bulut Tabanlı Yeni Nesil Restoran Otomasyonu</title>
</head>
<body style="background-color: #0b0f19; color: #f1f5f9; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; min-height: 100vh;">

    <!-- ========================================================= -->
    <!-- 🔐 MODAL: GÜN BAŞI KASA GİRİŞİ -->
    <!-- ========================================================= -->
    <div id="gbModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.9); display: none; align-items: center; justify-content: center; z-index: 9999;">
        <div style="background: #1e293b; padding: 35px; border-radius: 12px; border: 1px solid #475569; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);">
            <h3 style="color: #38bdf8; margin-bottom: 12px; font-size: 1.4rem; font-weight: 700;">☀️ Gün Başı Dönem Açılışı</h3>
            <p style="font-size: 0.9rem; color: #94a3b8; margin-bottom: 20px;">Lütfen kasadaki güncel nakit açılış tutarını giriniz:</p>
            <input type="number" id="openingCashInput" value="500" style="width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; text-align: center; font-size: 1.3rem; margin-bottom: 25px; outline: none; font-weight: bold; color: #38bdf8;">
            <button onclick="window.isShiftOpen=true; document.getElementById('gbModal').style.display='none'; document.getElementById('shiftStatusTxt').innerText='Dönem: SİSTEM AÇIK (Kasa: ' + document.getElementById('openingCashInput').value + ' TL)'; document.getElementById('panelGbBtn').style.display='none'; document.getElementById('panelGsBtn').style.display='block'; document.getElementById('shiftStatusTxt').style.color='#10b981';" style="background: #10b981; color: white; padding: 14px 25px; border-radius: 8px; font-size: 1rem; width: 100%; font-weight: 700; cursor: pointer; border:none; transition: 0.2s;">Dönemi Resmen Başlat</button>
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- 🔐 EKRAN 1: ŞİFRE GİRİŞ EKRANI (PINPAD) -->
    <!-- ========================================================= -->
    <div id="pinpadScreen" style="display: block; width: 100%; max-width: 380px; text-align: center; background: #1e293b; padding: 40px 35px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 30px 60px -15px rgba(0,0,0,0.7); margin: 80px auto;">
        <h1 style="font-size: 2.4rem; font-weight: 900; margin-bottom: 5px; letter-spacing: -0.5px; color: #ffffff;">Nexa<span style="color: #38bdf8;">POS</span></h1>
        <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 30px; font-weight: 500;">Kurumsal Restoran Otomasyon Terminali</p>
        <input type="password" id="pinDisplayInput" maxlength="4" readonly style="background: #0b0f19; width: 100%; border-radius: 10px; font-size: 2.4rem; letter-spacing: 15px; height: 75px; text-align: center; color: #38bdf8; border: 1px solid #475569; margin-bottom: 30px; font-weight: bold; outline: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);">
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
            <button onclick="if(document.getElementById('pinDisplayInput').value.length < 4) document.getElementById('pinDisplayInput').value += '1';" style="background: #334155; color: #fff; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border:1px solid #475569; cursor:pointer; transition: 0.1s;">1</button>
            <button onclick="if(document.getElementById('pinDisplayInput').value.length < 4) document.getElementById('pinDisplayInput').value += '2';" style="background: #334155; color: #fff; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border:1px solid #475569; cursor:pointer; transition: 0.1s;">2</button>
            <button onclick="if(document.getElementById('pinDisplayInput').value.length < 4) document.getElementById('pinDisplayInput').value += '3';" style="background: #334155; color: #fff; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border:1px solid #475569; cursor:pointer; transition: 0.1s;">3</button>
            <button onclick="if(document.getElementById('pinDisplayInput').value.length < 4) document.getElementById('pinDisplayInput').value += '4';" style="background: #334155; color: #fff; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border:1px solid #475569; cursor:pointer; transition: 0.1s;">4</button>
            <button onclick="if(document.getElementById('pinDisplayInput').value.length < 4) document.getElementById('pinDisplayInput').value += '5';" style="background: #334155; color: #fff; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border:1px solid #475569; cursor:pointer; transition: 0.1s;">5</button>
            <button onclick="if(document.getElementById('pinDisplayInput').value.length < 4) document.getElementById('pinDisplayInput').value += '6';" style="background: #334155; color: #fff; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border:1px solid #475569; cursor:pointer; transition: 0.1s;">6</button>
            <button onclick="if(document.getElementById('pinDisplayInput').value.length < 4) document.getElementById('pinDisplayInput').value += '7';" style="background: #334155; color: #fff; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border:1px solid #475569; cursor:pointer; transition: 0.1s;">7</button>
            <button onclick="if(document.getElementById('pinDisplayInput').value.length < 4) document.getElementById('pinDisplayInput').value += '8';" style="background: #334155; color: #fff; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border:1px solid #475569; cursor:pointer; transition: 0.1s;">8</button>
            <button onclick="if(document.getElementById('pinDisplayInput').value.length < 4) document.getElementById('pinDisplayInput').value += '9';" style="background: #334155; color: #fff; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border:1px solid #475569; cursor:pointer; transition: 0.1s;">9</button>
            <button onclick="document.getElementById('pinDisplayInput').value = '';" style="background: #ef4444; color: #fff; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border:none; cursor:pointer; transition: 0.1s;">C</button>
            <button onclick="if(document.getElementById('pinDisplayInput').value.length < 4) document.getElementById('pinDisplayInput').value += '0';" style="background: #334155; color: #fff; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border:1px solid #475569; cursor:pointer; transition: 0.1s;">0</button>
            <button onclick="if(document.getElementById('pinDisplayInput').value === '1234') { document.getElementById('pinpadScreen').style.display='none'; document.getElementById('sambaMainMenu').style.display='flex'; document.getElementById('pinDisplayInput').value=''; } else { alert('Hatalı Personel Şifresi!'); document.getElementById('pinDisplayInput').value=''; }" style="background: #10b981; color: #fff; padding: 22px; border-radius: 10px; font-size: 1.6rem; font-weight: 700; border:none; cursor:pointer; transition: 0.1s;">✔</button>
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- 👑 EKRAN 2: SAMBAPOS TARZI DEV KURUMSAL ANA MENÜ (ZINC/SLATE) -->
    <!-- ========================================================= -->
    <div id="sambaMainMenu" style="display: none; width: 100vw; height: 100vh; background: #0f172a; position: fixed; top: 0; left: 0; flex-direction: column; padding: 40px; box-sizing: border-box; justify-content: center; align-items: center; z-index: 500;">
        <div style="text-align: center; margin-bottom: 40px;">
            <h2 style="font-size: 2.4rem; color: #ffffff; font-weight: 900; letter-spacing: -0.5px; margin: 0;">Nexa<span style="color:#38bdf8;">POS</span> Terminal Panel</h2>
            <p style="color: #64748b; font-size: 0.95rem; margin-top: 5px; font-weight: 500;">Lütfen işlem yapmak istediğiniz kurumsal modülü seçiniz</p>
        </div>
        
        <!-- Üst Düzey Kurumsal Slate Grid Düzeni -->
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; width: 100%; max-width: 950px;">
            <button onclick="checkShiftAndOpen()" style="background: #1e293b; color: #f1f5f9; padding: 40px 20px; border-radius: 12px; font-size: 1.3rem; font-weight: 700; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.4); border: 1px solid #334155; height: 150px; cursor: pointer; transition: 0.2s;">
                <div style="font-size: 2rem; margin-bottom: 8px;">🖥️</div> POS Terminal (Masalar)
            </button>
            <button onclick="openSubPanel('donem')" style="background: #1e293b; color: #f1f5f9; padding: 40px 20px; border-radius: 12px; font-size: 1.3rem; font-weight: 700; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.4); border: 1px solid #334155; height: 150px; cursor: pointer; transition: 0.2s;">
                <div style="font-size: 2rem; margin-bottom: 8px;">☀️</div> Gün İşlemleri (Aç/Kapat)
            </button>
            <button onclick="openSubPanel('gecmis')" style="background: #1e293b; color: #f1f5f9; padding: 40px 20px; border-radius: 12px; font-size: 1.3rem; font-weight: 700; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.4); border: 1px solid #334155; height: 150px; cursor: pointer; transition: 0.2s;">
                <div style="font-size: 2rem; margin-bottom: 8px;">📑</div> Geçmiş Adisyon Kayıtları
            </button>
