<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaPOS - Kurumsal Bulut Otomasyon İstasyonu</title>
</head>
<body style="background-color: #0b0f19; color: #f1f5f9; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; min-height: 100vh; overflow: hidden;">

    <!-- ========================================================= -->
    <!-- ☀️ DIALOG: GÜN BAŞI KASA GİRİŞ MODAL PENCERESİ -->
    <!-- ========================================================= -->
    <div id="gbModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 8, 16, 0.9); display: none; align-items: center; justify-content: center; z-index: 99999;">
        <div style="background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); padding: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); max-width: 420px; width: 90%; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);">
            <h3 style="color: #38bdf8; margin-bottom: 10px; font-size: 1.6rem; font-weight: 800;">☀️ Gün Başı Kasa Girişi</h3>
            <p style="font-size: 0.9rem; color: #94a3b8; margin-bottom: 25px;">Kasadaki güncel nakit açılış tutarını giriniz:</p>
            <input type="number" id="openingCashInput" value="500" style="width: 100%; padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: #0b0f19; color: #fff; text-align: center; font-size: 1.4rem; margin-bottom: 25px; outline: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);">
            <button onclick="executeGunBasi()" style="background: linear-gradient(135deg, #10b981, #059669); color: white; padding: 15px; border-radius: 10px; font-size: 1.1rem; width: 100%; font-weight: 700; cursor: pointer; border:none; box-shadow: 0 4px 12px rgba(16,185,129,0.3);">Dönemi Resmen Başlat</button>
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- 🔐 EKRAN 1: ŞİFRE GİRİŞ EKRANI (PINPAD KAPISI) -->
    <!-- ========================================================= -->
    <div id="pinpadScreen" style="display: block; width: 100%; max-width: 380px; text-align: center; background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); padding: 40px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 30px 60px -15px rgba(0,0,0,0.6); margin: 7vh auto;">
        <h1 style="font-size: 2.4rem; font-weight: 900; margin-bottom: 5px; letter-spacing: -1px;">Nexa<span style="color: #38bdf8;">POS</span></h1>
        <p style="font-size: 0.9rem; color: #64748b; margin-bottom: 30px;">Kurumsal Otomasyon İstasyonu</p>
        <input type="password" id="pinDisplayInput" maxlength="4" readonly style="background: #060913; width: 100%; border-radius: 12px; font-size: 2.5rem; letter-spacing: 15px; height: 75px; text-align: center; color: #38bdf8; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 30px; font-weight: 900; outline: none; box-shadow: inset 0 4px 6px rgba(0,0,0,0.6);">
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
            <button onclick="appendPin('1')" style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.05); color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; cursor:pointer;">1</button>
            <button onclick="appendPin('2')" style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.05); color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; cursor:pointer;">2</button>
            <button onclick="appendPin('3')" style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.05); color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; cursor:pointer;">3</button>
            <button onclick="appendPin('4')" style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.05); color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; cursor:pointer;">4</button>
            <button onclick="appendPin('5')" style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.05); color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; cursor:pointer;">5</button>
            <button onclick="appendPin('6')" style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.05); color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; cursor:pointer;">6</button>
            <button onclick="appendPin('7')" style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.05); color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; cursor:pointer;">7</button>
            <button onclick="appendPin('8')" style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.05); color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; cursor:pointer;">8</button>
            <button onclick="appendPin('9')" style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.05); color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; cursor:pointer;">9</button>
            <button onclick="document.getElementById('pinDisplayInput').value = '';" style="background: #ef4444; color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; border:none; cursor:pointer;">C</button>
            <button onclick="appendPin('0')" style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.05); color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; cursor:pointer;">0</button>
            <button onclick="validatePinGate()" style="background: #10b981; color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; border:none; cursor:pointer;">✔</button>
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- 👑 EKRAN 2: SAMBAPOS TARZI DEV KURUMSAL ANA İSTASYON MENÜSÜ -->
    <!-- ========================================================= -->
    <div id="sambaMainMenu" style="display: none; width: 100vw; height: 100vh; background: #0b0f19; position: fixed; top: 0; left: 0; flex-direction: column; padding: 40px; box-sizing: border-box; justify-content: space-between; align-items: center; z-index: 500;">
        
        <h2 style="font-size: 2.2rem; color: #ffffff; font-weight: 800; margin-top: 4vh; letter-spacing: -1px; text-align: center;">Nexa<span style="color:#38bdf8;">POS</span> Ana İstasyon</h2>
        
        <!-- Premium Cam Efektli (Glassmorphism) Izgara Butonları -->
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; width: 100%; max-width: 1000px; padding: 20px; box-sizing: border-box;">
            <button onclick="verifyShiftPOS()" style="background: rgba(30, 41, 59, 0.45); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.07); color: #38bdf8; padding: 35px 20px; border-radius: 16px; font-size: 1.3rem; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; height: 160px; cursor: pointer; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);">
                <span style="font-size: 2.5rem;">🖥️</span> POS (Masalar)
            </button>
            <button onclick="routingSubPanel('donem')" style="background: rgba(30, 41, 59, 0.45); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.07); color: #ec4899; padding: 35px 20px; border-radius: 16px; font-size: 1.3rem; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; height: 160px; cursor: pointer; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);">
                <span style="font-size: 2.5rem;">☀️</span> Gün İşlemleri
            </button>
            <button onclick="routingSubPanel('gecmis')" style="background: rgba(30, 41, 59, 0.45); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.07); color: #a855f7; padding: 35px 20px; border-radius: 16px; font-size: 1.3rem; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; height: 160px; cursor: pointer; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);">
                <span style="font-size: 2.5rem;">📋</span> Geçmiş Adisyonlar
            </button>
            <button onclick="routingSubPanel('raporlar')" style="background: rgba(30, 41, 59, 0.45); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.07); color: #10b981; padding: 35px 20px; border-radius: 16px; font-size: 1.3rem; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; height: 160px; cursor: pointer; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);">
                <span style="font-size: 2.5rem;">📊</span> Raporlar
            </button>
            <button onclick="routingSubPanel('ayarlar')" style="background: rgba(30, 41, 59, 0.45); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.07); color: #94a3b8; padding: 35px 20px; border-radius: 16px; font-size: 1.3rem; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; height: 160px; cursor: pointer; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);">
                <span style="font-size: 2.5rem;">⚙️</span> Ayarlar
            </button>
