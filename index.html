<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaPOS - Premium Bulut Restoran Otomasyonu</title>
</head>
<body style="background-color: #0b0f19; color: #f1f5f9; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; user-select: none; min-height: 100vh; position: relative;">

    <!-- ========================================================= -->
    <!-- 🔐 MODAL: GÜN BAŞI KASA GİRİŞİ -->
    <!-- ========================================================= -->
    <div id="gbModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 8, 16, 0.9); display: none; align-items: center; justify-content: center; z-index: 99999;">
        <div style="background: #131b2e; padding: 40px; border-radius: 16px; border: 1px solid #1e293b; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 0 40px rgba(56, 189, 248, 0.1);">
            <h3 style="color: #38bdf8; margin-bottom: 12px; font-size: 1.5rem; font-weight: 700; letter-spacing: 0.5px;">☀️ Gün Başı Kasa Girişi</h3>
            <p style="font-size: 0.9rem; color: #94a3b8; margin-bottom: 20px;">Lütfen nakit kasa açılış tutarını giriniz:</p>
            <input type="number" id="openingCashInput" value="500" style="width: 100%; padding: 15px; border-radius: 8px; border: 1px solid #334155; background: #0b0f19; color: #fff; text-align: center; font-size: 1.4rem; margin-bottom: 25px; outline: none; font-weight: 700; color: #38bdf8;">
            <button onclick="executeGunBasiAction()" style="background: #10b981; color: white; padding: 15px; border-radius: 8px; font-size: 1.1rem; width: 100%; font-weight: 700; cursor: pointer; border:none; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);">Dönemi Resmen Başlat</button>
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- 🔐 EKRAN 1: ŞİFRE GİRİŞ EKRANI (PINPAD) -->
    <!-- ========================================================= -->
    <div id="pinpadScreen" style="display: block; width: 100%; max-width: 380px; text-align: center; background: #131b2e; padding: 40px; border-radius: 24px; border: 1px solid #1e293b; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7), 0 0 30px rgba(56, 189, 248, 0.05); margin: 60px auto;">
        <h1 style="font-size: 2.6rem; font-weight: 900; margin-bottom: 5px; letter-spacing: -0.5px; color: #ffffff;">Nexa<span style="color: #38bdf8; text-shadow: 0 0 20px rgba(56,189,248,0.4);">POS</span></h1>
        <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 30px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase;">PREMIUM RESTORAN SİSTEMİ</p>
        <input type="password" id="pinDisplayInput" maxlength="4" readonly style="background: #0b0f19; width: 100%; border-radius: 12px; font-size: 2.5rem; letter-spacing: 15px; height: 75px; text-align: center; color: #38bdf8; border: 1px solid #1e293b; margin-bottom: 30px; font-weight: 900; outline: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);">
        
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;">
            <button onclick="appendPin('1')" style="background: #1e293b; color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; border:1px solid #334155; cursor:pointer;">1</button>
            <button onclick="appendPin('2')" style="background: #1e293b; color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; border:1px solid #334155; cursor:pointer;">2</button>
            <button onclick="appendPin('3')" style="background: #1e293b; color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; border:1px solid #334155; cursor:pointer;">3</button>
            <button onclick="appendPin('4')" style="background: #1e293b; color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; border:1px solid #334155; cursor:pointer;">4</button>
            <button onclick="appendPin('5')" style="background: #1e293b; color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; border:1px solid #334155; cursor:pointer;">5</button>
            <button onclick="appendPin('6')" style="background: #1e293b; color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; border:1px solid #334155; cursor:pointer;">6</button>
            <button onclick="appendPin('7')" style="background: #1e293b; color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; border:1px solid #334155; cursor:pointer;">7</button>
            <button onclick="appendPin('8')" style="background: #1e293b; color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; border:1px solid #334155; cursor:pointer;">8</button>
            <button onclick="appendPin('9')" style="background: #1e293b; color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; border:1px solid #334155; cursor:pointer;">9</button>
            <button onclick="document.getElementById('pinDisplayInput').value = '';" style="background: #ef4444; color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; border:none; cursor:pointer;">C</button>
            <button onclick="appendPin('0')" style="background: #1e293b; color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; border:1px solid #334155; cursor:pointer;">0</button>
            <button onclick="executeLoginAuth()" style="background: #10b981; color: #fff; padding: 22px; border-radius: 12px; font-size: 1.6rem; font-weight: 700; border:none; cursor:pointer; box-shadow: 0 4px 15px rgba(16,185,129,0.3);">✔</button>
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- 👑 EKRAN 2: SAMBAPOS TARZI DEV KURUMSAL ANA MENÜ (DASHBOARD) -->
    <!-- ========================================================= -->
    <div id="sambaMainMenu" style="display: none; width: 100vw; height: 100vh; background: #0b0f19; position: fixed; top: 0; left: 0; flex-direction: column; padding: 30px; box-sizing: border-box; justify-content: space-between; align-items: center; z-index: 500;">
        
        <!-- ÜST BAŞLIK ALANI -->
        <div style="text-align: center; margin-top: 20px;">
            <h2 style="font-size: 2.4rem; color: #ffffff; font-weight: 900; letter-spacing: 0.5px; margin: 0;">Nexa<span style="color: #38bdf8; text-shadow: 0 0 20px rgba(56,189,248,0.3);">POS</span></h2>
            <p style="font-size: 0.9rem; color: #64748b; font-weight: 600; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px;">Ana İstasyon Yönetim Paneli</p>
        </div>

                <span style="font-size: 2.5rem;">🖥️</span>
                <span style="font-size: 1.3rem; font-weight: 800; letter-spacing: 0.5px;">POS Terminali</span>
            </button>
            <button onclick="openSubPanel('donem')" style="background: linear-gradient(135deg, #0e1726, #131f33); color: #fff; border-radius: 16px; border: 1px solid #1e293b; height: 170px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                <span style="font-size: 2.5rem;">☀️</span>
                <span style="font-size: 1.3rem; font-weight: 800; letter-spacing: 0.5px;">Gün İşlemleri</span>
            </button>
            <button onclick="openSubPanel('gecmis')" style="background: linear-gradient(135deg, #0e1726, #131f33); color: #fff; border-radius: 16px; border: 1px solid #1e293b; height: 170px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                <span style="font-size: 2.5rem;">📑</span>
                <span style="font-size: 1.3rem; font-weight: 800; letter-spacing: 0.5px;">Geçmiş Adisyonlar</span>
            </button>
            <button onclick="openSubPanel('raporlar')" style="background: linear-gradient(135deg, #0e1726, #131f33); color: #fff; border-radius: 16px; border: 1px solid #1e293b; height: 170px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                <span style="font-size: 2.5rem;">📊</span>
                <span style="font-size: 1.3rem; font-weight: 800; letter-spacing: 0.5px;">Raporlar</span>
            </button>
            <button onclick="openSubPanel('ayarlar')" style="background: linear-gradient(135deg, #0e1726, #131f33); color: #fff; border-radius: 16px; border: 1px solid #1e293b; height: 170px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                <span style="font-size: 2.5rem;">⚙️</span>
                <span style="font-size: 1.3rem; font-weight: 800; letter-spacing: 0.5px;">Ayarlar</span>
            </button>
